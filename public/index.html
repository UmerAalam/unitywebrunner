<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UnityWebRunner | Engine Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="glass-panel">
      <main class="preview-area">
        <div id="canvas-container">
          <div id="gameFrame" class="game-placeholder">
            The game opens in a separate window after upload.
          </div>
        </div>
        <div id="status">The game opens in a separate window after upload.</div>
      </main>

      <aside class="controls">
        <header>
          <h1>Unity<span>Web</span>Runner</h1>
        </header>

        <div class="section">
          <h2>Build Source</h2>
          <div class="upload-wrapper">
            <input type="file" id="files" webkitdirectory directory multiple hidden onchange="upload()" />
            <button class="primary-btn" onclick="chooseFolder()">
              <i data-lucide="folder-open"></i>
              Choose Folder
            </button>
          </div>
        </div>

        <div class="section">
          <h2>Resolution (16:9)</h2>
          <div class="select-wrap">
            <i data-lucide="monitor"></i>
            <select id="resolution" onchange="updateResolution()">
              <option value="854x480">480p</option>
              <option value="1280x720" selected>720p</option>
              <option value="1920x1080">1080p</option>
              <option value="2560x1440">1440p</option>
              <option value="3840x2160">4K</option>
            </select>
          </div>
        </div>

        <div class="section">
          <h2>Compression</h2>
          <div class="select-wrap">
            <i data-lucide="package"></i>
            <select id="compression" onchange="updateCompression()">
              <option value="none">None</option>
              <option value="gzip">Gzip</option>
              <option value="brotli">Brotli</option>
            </select>
          </div>
        </div>

        <div class="section">
          <h2>Theme</h2>
          <div class="select-wrap">
            <i data-lucide="palette"></i>
            <select id="theme" onchange="updateTheme()">
              <option value="aurora">Aurora</option>
              <option value="ember">Ember</option>
              <option value="forest">Forest</option>
              <option value="mono">Mono</option>
              <option value="catppuccin-dark">Catppuccin Dark</option>
            </select>
          </div>
        </div>

        <div class="site-link">
          <a href="https://www.umeraalam.com" target="_blank" rel="noopener noreferrer">
            <i data-lucide="globe"></i>
            Visit Site
          </a>
          <div class="social-row">
            <a class="social-btn" href="https://github.com/UmerAalam" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
              <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M12 .5A11.5 11.5 0 0 0 .5 12.1c0 5.1 3.3 9.3 7.9 10.9.6.1.8-.3.8-.6v-2.3c-3.2.7-3.8-1.4-3.8-1.4-.5-1.3-1.2-1.7-1.2-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 .1 1.8.8 2.1 1.6.9.6 2.3.4 2.9.2.1-.7.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.4-2.3 1.2-3.2-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2 1-.3 2-.5 3-.5s2 .2 3 .5c2.3-1.5 3.3-1.2 3.3-1.2.7 1.7.2 2.8.1 3.1.7.8 1.2 1.9 1.2 3.2 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.2.8 2.3v3.4c0 .3.2.7.8.6a11.6 11.6 0 0 0 7.9-10.9A11.5 11.5 0 0 0 12 .5Z"
                />
              </svg>
            </a>
            <a class="social-btn" href="https://instagram.com/umerrazzaq2022" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
              <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M7.8 1.5h8.4c3.5 0 6.3 2.8 6.3 6.3v8.4c0 3.5-2.8 6.3-6.3 6.3H7.8a6.3 6.3 0 0 1-6.3-6.3V7.8c0-3.5 2.8-6.3 6.3-6.3Zm0 2A4.3 4.3 0 0 0 3.5 7.8v8.4c0 2.4 1.9 4.3 4.3 4.3h8.4c2.4 0 4.3-1.9 4.3-4.3V7.8c0-2.4-1.9-4.3-4.3-4.3H7.8Zm9.1 1.5a1.4 1.4 0 1 1 0 2.8 1.4 1.4 0 0 1 0-2.8ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"
                />
              </svg>
            </a>
          </div>
        </div>
      </aside>
    </div>

    <script src="vendor/lucide.js"></script>

    <script>
      if (window.lucide && typeof window.lucide.createIcons === "function") {
        window.lucide.createIcons();
      }

      let isSelectingFolder = false;
      const THEME_STORAGE_KEY = "unitywebrunner-theme";

      function setResolution() {
        const status = document.getElementById("status");
        status.innerText = "The game opens in a separate window after upload.";
      }

      function updateResolution() {
        setResolution();
      }

      function applyTheme(theme) {
        document.body.setAttribute("data-theme", theme);
      }

      function updateTheme() {
        const themeSelect = document.getElementById("theme");
        const selectedTheme = themeSelect.value;
        applyTheme(selectedTheme);
        localStorage.setItem(THEME_STORAGE_KEY, selectedTheme);
      }

      function initTheme() {
        const themeSelect = document.getElementById("theme");
        const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
        const availableThemes = Array.from(themeSelect.options).map((opt) => opt.value);
        const theme = availableThemes.includes(savedTheme) ? savedTheme : "aurora";
        themeSelect.value = theme;
        applyTheme(theme);
      }

      async function upload() {
        const fileInput = document.getElementById("files");
        const status = document.getElementById("status");
        const compression = document.getElementById("compression");
        if (fileInput.files.length === 0) {
          status.innerText = "ERROR: NO SOURCE DETECTED";
          return;
        }
        status.innerText = "STREAMING SOURCE DATA...";
        const formData = new FormData();
        Array.from(fileInput.files).forEach((file) => {
          formData.append("files", file, file.webkitRelativePath);
        });
        try {
          const response = await fetch("/upload", {
            method: "POST",
            body: formData,
          });
          if (response.ok) {
            const result = await response.json();
            if (result.compression) {
              compression.value = result.compression;
            }
            await openGameWindow();
            status.innerText = `ENGINE INITIALIZED IN NEW WINDOW | ${compression.value.toUpperCase()}`;
          }
        } catch (error) {
          status.innerText = "CONNECTION FAILED";
          console.error("Upload Error:", error);
        }
      }

      async function chooseFolder() {
        if (isSelectingFolder) {
          return;
        }

        const status = document.getElementById("status");
        const compression = document.getElementById("compression");
        const fileInput = document.getElementById("files");

        if (!window.electronAPI || typeof window.electronAPI.selectFolder !== "function") {
          fileInput.click();
          return;
        }

        status.innerText = "WAITING FOR FOLDER SELECTION...";
        isSelectingFolder = true;
        try {
          const result = await window.electronAPI.selectFolder();
          if (!result?.success) {
            status.innerText = "FOLDER SELECTION CANCELLED";
            return;
          }

          if (result.compression) {
            compression.value = result.compression;
          }
          await openGameWindow();
          status.innerText = `ENGINE INITIALIZED | ${compression.value.toUpperCase()}`;
        } catch (error) {
          status.innerText = "FOLDER PICKER FAILED";
          console.error("Folder Picker Error:", error);
        } finally {
          isSelectingFolder = false;
        }
      }

      async function updateCompression() {
        const type = document.getElementById("compression").value;
        const status = document.getElementById("status");
        status.innerText = `CONFIGURING ${type.toUpperCase()}...`;
        try {
          await fetch(`/set-compression?type=${type}`);
          status.innerText = "ENGINE ACTIVE";
        } catch (error) {
          console.error("Compression Switch Error:", error);
        }
      }

      async function openGameWindow() {
        if (!window.electronAPI || typeof window.electronAPI.getGameUrl !== "function") {
          throw new Error("Game URL API unavailable");
        }

        const gameUrl = await window.electronAPI.getGameUrl();
        const win = window.open(`${gameUrl}?t=${Date.now()}`, "UnityWebRunnerGame");

        if (!win) {
          throw new Error("Unable to open game window");
        }
      }

      initTheme();
      setResolution();
    </script>
  </body>
</html>
