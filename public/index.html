<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UnityWebRunner | Engine Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="glass-panel">
      <main class="preview-area">
        <div id="canvas-container">
          <div id="gameFrame" class="game-placeholder">
            The game opens in a separate window after upload.
          </div>
        </div>
        <div id="status">SYSTEM READY</div>
      </main>

      <aside class="controls">
        <header>
          <h1>Unity<span>Web</span>Runner</h1>
        </header>

        <div class="section">
          <h2>Build Source</h2>
          <div class="upload-wrapper">
            <input type="file" id="files" webkitdirectory directory multiple hidden onchange="upload()" />
            <button class="primary-btn" onclick="chooseFolder()">
              Choose Folder
            </button>
          </div>
          <div class="path-row">
            <input
              id="folderPath"
              type="text"
              placeholder="/absolute/path/to/UnityBuild"
              class="path-input"
            />
            <button class="primary-btn" onclick="useFolderPath()">Use Path</button>
          </div>
        </div>

        <div class="section">
          <h2>Resolution (3:2)</h2>
          <div class="res-grid">
            <button class="res-btn" onclick="setResolution(720, 480, this)">
              720p
            </button>
            <button
              class="res-btn active"
              onclick="setResolution(960, 640, this)"
            >
              960p
            </button>
            <button class="res-btn" onclick="setResolution(1200, 800, this)">
              1200p
            </button>
            <button class="res-btn" onclick="setResolution(1440, 960, this)">
              1440p
            </button>
          </div>
        </div>

        <div class="section">
          <h2>Compression</h2>
          <select id="compression" onchange="updateCompression()">
            <option value="none">None</option>
            <option value="gzip">Gzip</option>
            <option value="brotli">Brotli</option>
          </select>
        </div>

        <div class="site-link">
          <a href="https://www.umeraalam.com" target="_blank" rel="noopener noreferrer">
            Visit Site
          </a>
        </div>
      </aside>
    </div>

    <script>
      let isSelectingFolder = false;
      let isSettingPath = false;
      let lastSetPath = "";

      function setResolution(width, height, element) {
        const container = document.getElementById("canvas-container");
        const status = document.getElementById("status");
        document
          .querySelectorAll(".res-btn")
          .forEach((btn) => btn.classList.remove("active"));
        element.classList.add("active");
        container.style.maxWidth = `${width}px`;
        status.innerText = `ENGINE ACTIVE | ${width}x${height}`;
        const frame = document.getElementById("gameFrame");
        frame.style.width = `${width}px`;
        frame.style.height = `${height}px`;
      }

      async function upload() {
        const fileInput = document.getElementById("files");
        const status = document.getElementById("status");
        const compression = document.getElementById("compression");
        if (fileInput.files.length === 0) {
          status.innerText = "ERROR: NO SOURCE DETECTED";
          return;
        }
        status.innerText = "STREAMING SOURCE DATA...";
        const formData = new FormData();
        Array.from(fileInput.files).forEach((file) => {
          formData.append("files", file, file.webkitRelativePath);
        });
        try {
          const response = await fetch("/upload", {
            method: "POST",
            body: formData,
          });
          if (response.ok) {
            const result = await response.json();
            if (result.compression) {
              compression.value = result.compression;
            }
            await openGameWindow();
            status.innerText = `ENGINE INITIALIZED IN NEW WINDOW | ${compression.value.toUpperCase()}`;
          }
        } catch (error) {
          status.innerText = "CONNECTION FAILED";
          console.error("Upload Error:", error);
        }
      }

      async function chooseFolder() {
        if (isSelectingFolder) {
          return;
        }

        const status = document.getElementById("status");
        const compression = document.getElementById("compression");

        if (!window.electronAPI || typeof window.electronAPI.selectFolder !== "function") {
          status.innerText = "ELECTRON API UNAVAILABLE";
          console.error("electronAPI.selectFolder is unavailable");
          return;
        }

        status.innerText = "WAITING FOR FOLDER SELECTION...";
        isSelectingFolder = true;
        try {
          const result = await window.electronAPI.selectFolder();
          if (!result?.success) {
            status.innerText = "FOLDER SELECTION CANCELLED";
            return;
          }

          if (result.compression) {
            compression.value = result.compression;
          }
          await openGameWindow();
          status.innerText = `ENGINE INITIALIZED | ${compression.value.toUpperCase()}`;
        } catch (error) {
          status.innerText = "FOLDER PICKER FAILED";
          console.error("Folder Picker Error:", error);
        } finally {
          isSelectingFolder = false;
        }
      }

      async function useFolderPath() {
        if (isSettingPath) {
          return;
        }

        const status = document.getElementById("status");
        const compression = document.getElementById("compression");
        const folderPath = document.getElementById("folderPath").value;
        const normalizedPath = folderPath.trim();

        if (!normalizedPath) {
          status.innerText = "INVALID PATH: PATH IS EMPTY";
          return;
        }

        if (normalizedPath === lastSetPath) {
          await openGameWindow();
          status.innerText = `ENGINE INITIALIZED | ${compression.value.toUpperCase()}`;
          return;
        }

        if (!window.electronAPI || typeof window.electronAPI.setRootDir !== "function") {
          status.innerText = "ELECTRON API UNAVAILABLE";
          return;
        }

        status.innerText = "VALIDATING BUILD PATH...";
        isSettingPath = true;
        try {
          const result = await window.electronAPI.setRootDir(normalizedPath);
          if (!result?.success) {
            status.innerText = `INVALID PATH: ${(result && result.error) || "UNKNOWN ERROR"}`;
            return;
          }

          if (result.compression) {
            compression.value = result.compression;
          }
          lastSetPath = normalizedPath;
          await openGameWindow();
          status.innerText = `ENGINE INITIALIZED | ${compression.value.toUpperCase()}`;
        } catch (error) {
          status.innerText = "PATH LOAD FAILED";
          console.error("Path Load Error:", error);
        } finally {
          isSettingPath = false;
        }
      }

      async function updateCompression() {
        const type = document.getElementById("compression").value;
        const status = document.getElementById("status");
        status.innerText = `CONFIGURING ${type.toUpperCase()}...`;
        try {
          await fetch(`/set-compression?type=${type}`);
          status.innerText = "ENGINE ACTIVE";
        } catch (error) {
          console.error("Compression Switch Error:", error);
        }
      }

      async function openGameWindow() {
        if (!window.electronAPI || typeof window.electronAPI.getGameUrl !== "function") {
          throw new Error("Game URL API unavailable");
        }

        const gameUrl = await window.electronAPI.getGameUrl();
        const win = window.open(`${gameUrl}?t=${Date.now()}`, "UnityWebRunnerGame");

        if (!win) {
          throw new Error("Unable to open game window");
        }
      }
    </script>
  </body>
</html>
